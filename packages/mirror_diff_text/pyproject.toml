[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-diff-text"
version = "0.1.0"
description = "Text diff provider for Mirror Diff"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-diff>=0.1.0",
]

[project.entry-points."mirror"]
text = "mirror_diff_text:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_diff_text*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
