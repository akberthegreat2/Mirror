[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-monitor-memory"
version = "0.1.0"
description = "Memory-backed provider for Mirror Monitor"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-monitor>=0.1.0",
    "httpx>=0.24",
]

[project.entry-points."mirror"]
memory = "mirror_monitor_memory:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_monitor_memory*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
