[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-crawl-scrapy"
version = "0.1.0"
description = "Scrapy provider for the Mirror Crawl capability"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-crawl>=0.1.0",
    "scrapy>=2.11",
]

[project.entry-points."mirror.providers"]
crawl-scrapy = "mirror_crawl_scrapy:provider"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_crawl_scrapy*"]
namespaces = false
