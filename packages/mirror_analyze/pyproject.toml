
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-analyze"
version = "0.1.0"
description = "Mirror analyze capability package"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.entry-points."mirror.capabilities"]
analyze = "mirror_analyze.capability:capability"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_analyze*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
