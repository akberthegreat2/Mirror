[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-middleware"
version = "0.1.0"
description = "Built-in middleware for Mirror framework"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
dev = ["ruff", "mypy"]

[project.entry-points."mirror"]
retry = "mirror_middleware.retry:middleware_config"
timeout = "mirror_middleware.timeout:middleware_config"
ratelimit = "mirror_middleware.ratelimit:middleware_config"
logging = "mirror_middleware.logging:middleware_config"
tracing = "mirror_middleware.tracing:middleware_config"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_middleware*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
