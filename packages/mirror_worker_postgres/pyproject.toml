[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-worker-postgres"
version = "0.1.0"
description = "PostgreSQL durable worker backend for Mirror"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "psycopg>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_worker_postgres*"]
namespaces = false

[tool.pytest.ini_options]
markers = ["integration: requires real external infrastructure"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
mirror_worker_postgres = ["migrations/*.sql"]
