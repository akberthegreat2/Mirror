[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-execution-celery"
version = "0.1.0"
description = "Celery execution transport for Mirror"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mirror-core>=0.1.0",
    "mirror-worker-postgres>=0.1.0",
    "celery>=5.6",
    "redis>=6.2",
    "tzlocal>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
mirror-celery-worker = "mirror_execution_celery.cli:main"
mirror-celery-submit = "mirror_execution_celery.cli:submit_main"
mirror-celery-beat = "mirror_execution_celery.cli:beat_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_execution_celery*"]
namespaces = false

[tool.pytest.ini_options]
markers = ["integration: requires real external infrastructure"]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
