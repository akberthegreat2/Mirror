[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-core"
version = "0.1.0"
description = "Mirror core kernel – capability-agnostic chassis"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Mirror Contributors"}]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "packaging>=23.0",
    "tomli>=2.0; python_version < \"3.11\"",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0"]
dev = ["ruff>=0.1.0", "mypy>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mirror_core*"]
namespaces = false

[tool.pytest.ini_options]
# Discover every package test suite from the monorepo root.
testpaths = ["packages"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.10"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tomllib", "tomli", "yaml", "warcio"]
ignore_missing_imports = true
